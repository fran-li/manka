<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Plato registrado</title>
</head>
<body>
    <h2>Plato registrado en tu historial</h2>
    <p>Hola <strong th:text="${firstName}">usuario</strong>,</p>
    <p>Manka registró que cocinaste <strong th:text="${dishName}">un plato</strong>.</p>
    <p>Fecha del registro: <span th:text="${cookedAt}">fecha</span>.</p>
    <p>Este historial se utilizará para evitar recomendarte lo mismo demasiado seguido.</p>
</body>
</html>
