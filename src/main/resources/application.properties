spring.application.name=manka
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/manka}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.private.key=classpath:app.key
jwt.public.key=classpath:app.pub

manka.scoring.ingredient-coverage=0.45
manka.scoring.time=0.20
manka.scoring.protein-variety=0.10
manka.scoring.repetition=0.20
manka.scoring.popularity=0.05

server.port=8083

# Correo local para desarrollo. Docker Compose levanta Mailpit en SMTP 1025 y UI 8025.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

manka.mail.enabled=${MAIL_ENABLED:true}
manka.mail.from=${MAIL_FROM:noreply@manka.local}
